[package]
name = "LachsLauncher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "LachsLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
lachslauncher-core = { path = "../core" }
tauri = { workspace = true, features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
zip = { workspace = true }