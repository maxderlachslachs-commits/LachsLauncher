<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: https://cdn.modrinth.com https://crafatar.com data:; style-src 'self' 'unsafe-inline'">
<title>LachsLauncher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="bgimg"></div>
  <div id="bgdim"></div>
  <div class="fx" aria-hidden="true"><i></i><i></i></div>
  <aside id="side"><span id="navind"></span><div id="navlist"></div></aside>
  <header class="drag">
    <div class="left nodrag">
      <button id="hback" class="hbtn" title="Zurück" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="hfwd" class="hbtn" title="Vorwärts" disabled><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <img id="applogo" class="applogo" alt="" hidden>
      <h1>LachsLauncher<small id="ver"></small></h1>
    </div>
    <div class="right nodrag">
      <button id="runchip" class="chip sm btn" title="Laufende Instanzen"><i class="dot"></i><span>Keine Instanz</span></button>
      <button id="acct" class="chip sm btn"><canvas id="acct-av" width="20" height="20"></canvas><span id="acct-name">Anmelden</span></button>
      <button id="min" class="win" title="Minimieren"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="max" class="win" title="Maximieren"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      <button id="close" class="win x" title="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
  <footer><span id="status">Bereit</span><span id="hintkeys">Strg + K  Suche</span><div id="prog"><i></i></div></footer>
</div>

<div id="login-gate" class="login-gate hidden">
  <div class="login-card">
    <img src="logo.svg" alt="" style="width:64px;height:64px;border-radius:16px;margin-bottom:16px;" />
    <h1>LachsLauncher</h1>
    <p>Melde dich mit deinem Microsoft-Account an, um fortzufahren.</p>
    <button id="btn-login-gate" class="btn primary" style="width:100%;">Mit Microsoft anmelden</button>
    <button id="btn-offline-gate" class="btn ghost" style="margin-top:8px;width:100%;">Offline spielen</button>
    <div id="login-gate-status" class="status" style="margin-top:12px;"></div>
  </div>
</div>

<div id="modal-import" class="hide">
  <div class="dlg">
    <h2>Neues Modpack</h2>
    <label>Name<input id="m-name" class="search" placeholder="Mein Modpack" maxlength="40" autocomplete="off" spellcheck="false"></label>
    <label>Minecraft-Version<select id="m-ver" class="chip"></select></label>
    <div class="lbl">Cover (optional)</div>
    <div class="covpick"><button id="m-cover" class="chip btn sm">Bild wählen</button><span id="m-covname">Kein Bild</span></div>
    <div class="row">
      <button id="m-cancel" class="chip btn">Abbrechen</button>
      <button id="m-ok" class="chip play">Erstellen</button>
    </div>
    <div id="import-status" class="status"></div>
  </div>
</div>

<div id="modal-mods" class="hide">
  <div class="dlg wide" id="pbox">
    <h2 id="mods-title">Mods bearbeiten</h2>
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <input id="mod-search" class="search" placeholder="Mod suchen (CurseForge)…" style="flex:1;" />
      <button id="btn-mod-search" class="chip play sm">Suchen</button>
    </div>
    <div id="mod-search-results" style="max-height:20vh;overflow:auto;margin-bottom:8px;"></div>
    <div id="mods-list" style="max-height:40vh;overflow:auto;margin:12px 0;"></div>
    <div class="row">
      <button id="btn-mods-close" class="chip btn">Schließen</button>
    </div>
  </div>
</div>

<div id="cmodal" class="hide">
  <div class="dlg">
    <h2 id="c-title">Bestätigen</h2>
    <p id="c-text" class="hint"></p>
    <div class="row">
      <button id="c-no" class="chip btn">Abbrechen</button>
      <button id="c-yes" class="chip danger">Löschen</button>
    </div>
  </div>
</div>

<div id="pal" class="hide">
  <div class="palbox">
    <input id="pal-q" placeholder="Seite, Instanz oder Befehl suchen…" autocomplete="off" spellcheck="false">
    <div id="pal-list"></div>
  </div>
</div>
<div id="toasts"></div>

<script src="main.js"></script>
</body>
</html>
